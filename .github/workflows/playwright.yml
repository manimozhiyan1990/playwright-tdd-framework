name: Playwright Tests (Debug)

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Enable debug logs (VERY IMPORTANT)
      - name: Enable debug logging
        run: |
          echo "ACTIONS_RUNNER_DEBUG=true" >> $GITHUB_ENV
          echo "ACTIONS_STEP_DEBUG=true" >> $GITHUB_ENV

      # 3. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4. Print system info (helps debugging)
      - name: System Info
        run: |
          node -v
          npm -v
          npx playwright --version
          pwd
          ls -la

      # 5. Install dependencies
      - name: Install dependencies
        run: npm install

      # 6. Install browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 7. Run tests with detailed logs
      - name: Run Playwright tests (debug mode)
        run: |
          DEBUG=pw:api npx playwright test --reporter=line

      # 8. Upload Playwright HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # 9. Upload test results (screenshots/videos)
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/